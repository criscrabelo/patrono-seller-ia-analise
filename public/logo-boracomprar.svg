<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Círculo amarelo de fundo -->
  <circle cx="100" cy="100" r="100" fill="#F5C000"/>

  <!-- Carrinho de compras (corpo) -->
  <g transform="translate(30, 28)">
    <!-- Cabo do carrinho -->
    <line x1="8" y1="30" x2="22" y2="30" stroke="#1A1A1A" stroke-width="7" stroke-linecap="round"/>
    <!-- Estrutura do carrinho -->
    <path d="M22 30 L28 68 L100 68 L108 38 L28 38 Z" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"/>
    <!-- Rodas -->
    <circle cx="42" cy="80" r="7" fill="#F07820" stroke="#1A1A1A" stroke-width="4"/>
    <circle cx="86" cy="80" r="7" fill="#F07820" stroke="#1A1A1A" stroke-width="4"/>

    <!-- Sacola laranja dentro do carrinho -->
    <rect x="38" y="22" width="52" height="48" rx="5" fill="#F07820" stroke="#1A1A1A" stroke-width="5"/>
    <!-- Alça da sacola -->
    <path d="M50 22 Q50 10 64 10 Q78 10 78 22" fill="none" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
    <!-- Raios de clique na sacola -->
    <line x1="64" y1="40" x2="64" y2="32" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="64" y1="40" x2="72" y2="35" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="64" y1="40" x2="56" y2="35" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Mão/cursor apontando -->
    <g transform="translate(52, 36)">
      <!-- Palma -->
      <path d="M18 28 Q4 24 2 36 Q0 46 10 50 L36 52 Q46 52 48 42 L50 20 Q50 14 44 14 Q42 6 36 8 Q34 2 28 4 Q24 0 18 4 L18 28 Z" fill="#FFF5E0" stroke="#1A1A1A" stroke-width="4.5" stroke-linejoin="round"/>
      <!-- Dedo indicador -->
      <rect x="14" y="0" width="10" height="30" rx="5" fill="#FFF5E0" stroke="#1A1A1A" stroke-width="4.5"/>
    </g>
  </g>

  <!-- Texto BoraComprar -->
  <text x="100" y="172" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="middle" fill="#1A1A1A" letter-spacing="-0.5">BoraComprar</text>
</svg>
